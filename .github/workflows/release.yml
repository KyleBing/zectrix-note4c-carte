# 推送 v* tag 时自动编译固件、合并镜像并发布 GitHub Release
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（留空则用当前 ref）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install -U platformio esptool

      - name: Build firmware
        working-directory: firmware
        run: pio run -e note4c

      - name: Package artifacts
        id: pkg
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          BUILD="firmware/.pio/build/note4c"
          OUT="dist"
          mkdir -p "$OUT"

          # bootloader + partitions + app（16MB / default_16MB）
          esptool.py --chip esp32s3 merge_bin \
            -o "$OUT/note4c-${TAG}-merged.bin" \
            --flash_mode qio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0x10000 "$BUILD/firmware.bin"

          cp "$BUILD/firmware.bin" "$OUT/note4c-${TAG}-firmware.bin"
          ls -lh "$OUT"

      - name: Build release notes
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          export TAG
          {
            echo "## NOTE4C ${TAG}"
            echo ""
            echo "硬件自检固件：串口 + 四色墨水屏状态页。"
            echo ""
            echo "---"
            echo ""
            envsubst < .github/templates/release-flash.md
          } > release-body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: NOTE4C ${{ steps.pkg.outputs.tag }}
          body_path: release-body.md
          files: |
            dist/note4c-${{ steps.pkg.outputs.tag }}-merged.bin
            dist/note4c-${{ steps.pkg.outputs.tag }}-firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger Deploy Docs
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docs.yml',
              ref: 'main',
            })
